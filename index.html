<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>سجل الفحوصات | الدقة للبصريات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFBFA; --alt: #EEF1F3; --surface: #FFFFFF;
    --ink: #15171A; --muted: #565C63; --line: #D5D9DD;
    --accent: #A4501A; --on-accent: #FFFFFF; --danger: #B3261E;
    --display: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
    --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315; --alt: #191C1F; --surface: #1B1E21;
      --ink: #F0F0EC; --muted: #A3A9AF; --line: #2E3338;
      --accent: #E59A5C; --on-accent: #111315; --danger: #F2857D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111315; --alt: #191C1F; --surface: #1B1E21;
    --ink: #F0F0EC; --muted: #A3A9AF; --line: #2E3338;
    --accent: #E59A5C; --on-accent: #111315; --danger: #F2857D;
  }

  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* Top bar */
  .bar { background: var(--surface); border-bottom: 1px solid var(--line); padding: .7rem 1.25rem; display: flex; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .bar h1 { font-family: var(--display); font-weight: 800; font-size: 1.2rem; line-height: 1.5; }
  .bar .shop { color: var(--muted); font-size: .9rem; }
  .bar-actions { margin-inline-start: auto; display: flex; gap: .5rem; flex-wrap: wrap; }

  .btn { min-height: 2.9rem; padding: .6rem 1.15rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn-small { min-height: 2.4rem; padding: .3rem .85rem; font-size: .95rem; }

  /* Layout */
  .cols { display: grid; grid-template-columns: minmax(18rem, 24rem) 1fr; min-height: calc(100vh - 4.4rem); }
  .list-col { border-inline-end: 1px solid var(--line); padding: 1rem; }
  .detail-col { padding: 1.25rem clamp(1rem, 3vw, 2rem) 3rem; min-width: 0; }
  .back { display: none; margin-bottom: 1rem; }

  .inp { width: 100%; min-height: 3rem; border: 1.5px solid var(--line); border-radius: 10px; padding: .5rem .8rem; background: var(--surface); }
  .card .inp { background: var(--bg); }
  .inp:focus-visible { outline-offset: 1px; border-color: var(--accent); }
  textarea.inp { min-height: 5.5rem; resize: vertical; }

  .count { color: var(--muted); font-size: .9rem; margin-top: .75rem; }
  .note { display: block; width: 100%; text-align: start; margin-top: .75rem; padding: .6rem .8rem; border: 1.5px solid var(--accent); border-radius: 10px; background: transparent; cursor: pointer; font-size: .95rem; }
  .plist { list-style: none; padding: 0; margin-top: .5rem; display: grid; gap: .5rem; }
  .pitem { display: block; width: 100%; text-align: start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: .7rem .9rem; cursor: pointer; }
  .pitem:hover { border-color: var(--accent); }
  .pitem[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pitem b { display: block; font-weight: 600; }
  .pitem span { display: block; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); padding: 1rem .25rem; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  .card h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1.5; }
  .card h3 { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
  .head { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: flex-start; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .meta { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; color: var(--muted); margin-top: .25rem; }
  .meta a { text-underline-offset: 4px; }
  .notes { margin-top: .5rem; }
  .exam-top { display: flex; flex-wrap: wrap; gap: .5rem 1rem; justify-content: space-between; align-items: center; }
  .tag { display: inline-block; margin-inline-start: .6rem; padding: .05rem .6rem; font-size: .8rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-family: var(--body); font-weight: 600; }
  .section-title { font-family: var(--display); font-weight: 600; margin: 1.5rem 0 .75rem; }

  .tablewrap { overflow-x: auto; }
  table.rx { width: 100%; border-collapse: collapse; text-align: center; margin-top: .6rem; direction: ltr; }
  .rx th, .rx td { border: 1px solid var(--line); padding: .4rem .45rem; }
  .rx th { background: var(--alt); font-weight: 600; font-size: .85rem; }
  .rx td.eye { background: var(--alt); font-weight: 600; white-space: nowrap; }
  .rx td.eye small { color: var(--muted); font-weight: 400; margin-inline-start: .3rem; }
  .rx .inp { min-width: 4rem; text-align: center; padding-inline: .3rem; }
  .extra { margin-top: .6rem; color: var(--muted); }
  .extra b { color: var(--ink); font-weight: 600; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-weight: 500; font-size: .95rem; margin-bottom: .25rem; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: .6rem; }
  .error { color: var(--danger); font-weight: 500; margin-bottom: .75rem; }
  .form-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }

  .badge { display: inline-block; min-width: 1.4rem; padding: 0 .45rem; margin-inline-start: .4rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: .85rem; line-height: 1.5rem; text-align: center; }
  .remind p { margin-bottom: .6rem; }
  .rrow { display: flex; flex-wrap: wrap; gap: .6rem 1rem; justify-content: space-between; align-items: center; }
  .rrow small { display: block; color: var(--muted); }

  .glasses { display: flex; flex-wrap: wrap; gap: .5rem 1rem; justify-content: space-between; align-items: center; margin-top: .9rem; padding-top: .8rem; border-top: 1px dashed var(--line); }
  .ok { color: var(--accent); font-weight: 600; }
  .flag { color: var(--accent); font-weight: 600; }
  .check { display: flex; align-items: center; gap: .6rem; font-weight: 500; margin: .25rem 0 1rem; cursor: pointer; }
  .check input { width: 1.4rem; height: 1.4rem; accent-color: var(--accent); }
  canvas.examimg { display: block; width: 100%; max-width: 34rem; height: auto; border: 1px solid var(--line); border-radius: 8px; margin: 0 auto; background: #fff; }

  .lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 1rem; }
  .lockcard { width: min(22rem, 100%); text-align: center; margin: 0; }
  .lockcard .inp { text-align: center; letter-spacing: .4em; font-size: 1.4rem; margin: .75rem 0; }
  .lockcard .error { min-height: 1.6rem; margin: 0 0 .5rem; }
  body.locked .bar, body.locked .cols, body.locked .foot { display: none; }

  .sign { width: 100%; margin-top: .3rem; min-height: 2.3rem; padding: .1rem .3rem; font-size: .9rem; }

  .btn-whatsapp { background: #25D366; border-color: #25D366; color: #fff; }
  .btn-whatsapp:hover { filter: brightness(1.08); }

  .card.ext { border-color: #7FC3EE; box-shadow: inset 0 0 0 1px #7FC3EE; background: rgba(14, 148, 233, .06); }
  .ext-badge { display: inline-block; margin-inline-start: .6rem; padding: .05rem .6rem; font-size: .8rem; border-radius: 999px; background: #0EA5E9; color: #fff; font-family: var(--body); font-weight: 600; }
  .src-row { color: #0369A1; margin-top: .3rem; }
  :root:not([data-theme="light"]) .src-row { color: #38BDF8; }

  .home { text-align: center; padding: 1.5rem 1rem 1rem; }
  .home .icon { font-size: 3.2rem; margin-bottom: .4rem; }
  .home h2 { font-family: var(--display); font-size: 1.5rem; margin-bottom: .35rem; }
  .home p { color: var(--muted); margin-bottom: 1.4rem; }
  .home .btn-primary { min-height: 3.3rem; padding: .9rem 2rem; font-size: 1.05rem; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: .9rem; margin-top: 1.5rem; text-align: center; }
  @media (min-width: 40rem) { .stats { grid-template-columns: repeat(3, 1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem .5rem; }
  .stat b { display: block; font-family: var(--display); font-size: 1.7rem; color: var(--accent); }
  .stat span { color: var(--muted); font-size: .82rem; }

  .addpd { display: flex; direction: ltr; justify-content: flex-start; gap: 1rem; }
  .lensrow { margin-top: 1rem; }
  .suggest { position: relative; }
  .suggest-box { position: absolute; z-index: 20; top: 100%; inset-inline: 0; margin-top: .3rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 22px rgba(0,0,0,.14); max-height: 13rem; overflow-y: auto; }
  .suggest-item { display: block; width: 100%; text-align: start; padding: .65rem .9rem; border: 0;
    background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .suggest-item:hover, .suggest-item:focus-visible { background: var(--alt); }
  .pin-mask { -webkit-text-security: disc; text-security: disc; }
  .decrow { display: flex; gap: .5rem; align-items: stretch; }
  .decrow .sign { width: auto; margin: 0; min-width: 5.2rem; }

  .foot { color: var(--muted); font-size: .85rem; padding: 1rem 1.25rem 2rem; text-align: center; }

  @media (max-width: 52rem) {
    .cols { grid-template-columns: 1fr; }
    .detail-col { display: none; }
    body.detail-open .detail-col { display: block; }
    body.detail-open .list-col { display: none; }
    .back { display: inline-flex; align-items: center; }
    .list-col { border-inline-end: 0; }
  }
  @media (max-width: 34rem) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="lock" id="lock" hidden>
  <form class="card lockcard" id="lockForm" novalidate autocomplete="off">
    <h2>سجل فحوصات النظر</h2>
    <p class="hint">أدخل الرمز السري للدخول</p>
    <input class="inp ltr pin-mask" id="lockPin" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="الرمز السري">
    <p class="error" id="lockErr" role="alert"></p>
    <button class="btn btn-primary" type="submit" style="width:100%">دخول</button>
  </form>
</div>

<div class="bar">
  <h1>سجل فحوصات النظر</h1>
  <span class="shop">الدقة للبصريات</span>
  <div class="bar-actions">
    <button class="btn" id="btnHome" type="button">🏠 الشاشة الرئيسية</button>
    <button class="btn" id="btnRemind" type="button">التذكيرات<span class="badge" id="badge" hidden></span></button>
    <button class="btn" id="btnBackup" type="button">الإعدادات</button>
    <button class="btn" id="btnLock" type="button" hidden>🔒 قفل</button>
  </div>
</div>

<div class="cols">
  <aside class="list-col">
    <button class="btn btn-primary" id="btnAddSide" type="button" style="width:100%;margin-bottom:.75rem">+ إضافة مريض جديد</button>
    <input class="inp" id="search" type="search" placeholder="ابحث بالاسم أو رقم الهاتف" autocomplete="off" aria-label="بحث عن مريض">
    <button class="note" id="noteDraft" type="button" hidden></button>
    <button class="note" id="noteDue" type="button" hidden></button>
    <button class="note" id="note" type="button" hidden></button>
    <div class="count" id="count" aria-live="polite"></div>
    <ul class="plist" id="plist"></ul>
  </aside>
  <main class="detail-col" id="detail"></main>
</div>

<p class="foot">السجلات محفوظة على هذا الجهاز فقط داخل المتصفح، ولا تُرسل إلى أي جهة. خذ نسخة احتياطية بانتظام.</p>

<script>
(function () {
  'use strict';

  var KEY = 'aldiqqa_patients_v1';
  var BK = 'aldiqqa_last_backup_v1';
  /* ===== إعدادات التذكير ===== */
  var REMIND_MONTHS = 6;   // عدد الأشهر بعد آخر فحص
  var IDLE_MS = 5 * 60 * 1000;   // القفل التلقائي بعد 30 دقائق من عدم الاستخدام
  function remindMessage(p) {
    return 'السلام عليكم ' + p.name + '،\n' +
      'نذكّرك بأنه مرّت ' + REMIND_MONTHS + ' أشهر على آخر فحص نظر لك في الدقة للبصريات، وقد حان موعد إعادة الفحص للاطمئنان على سلامة نظرك.\n' +
      'يسعدنا استقبالك في الدقة للبصريات في مجمع نور العباس الطبي، كربلاء، من ٤ عصراً حتى ١٠ ليلاً.\n' +
      'للحجز رد على هذه الرسالة.';
  }
  var SHOP = {
    name: 'الدقة للبصريات',
    tagline: 'عيادة طبية متخصصة في عمل وتركيب النظارات الطبية والعدسات اللاصقة',
    address: 'كربلاء المقدسة، مجمع نور العباس الطبي، مجاور مستشفى العباس (ع) الأهلي',
    phone: '07732906486',
    hours: 'من الساعة 4:00 عصراً إلى الساعة 10:00 ليلاً'
  };
  function readyMessage(p) {
    return 'السلام عليكم ' + p.name + '،\n' +
      'تم اكتمال عمل النظارة، يرجى التوجه إلى العيادة لغرض الاستلام.\n' +
      'مع الشكر والتقدير.\n\n' +
      SHOP.name + '\n' +
      'أوقات الدوام: ' + SHOP.hours + '.';
  }
  /* ========================== */

  var COLS = ['sph', 'cyl', 'axis', 'ucva', 'bcva'];
  var HEADS = ['SPH', 'CYL', 'AXIS', 'UCVA', 'BCVA'];
  var VA_OPTS = ['6/6', '6/9', '6/12', '6/18', '6/24', '6/36', '6/60', 'CF', 'HM', 'PL', 'NPL'];
  var SOURCE_OPTS = ['مستشفى', 'مستوصف صحي', 'عيادة خارجية أخرى', 'حسب طلب الزبون', 'درجة نظارة قديمة'];
  var LENS_OPTS = ['ملتي كوت', 'بلوكات أخضر', 'بلوكت أزرق', 'فوتو بلاستك', 'فوتو بلوكات', 'فوتو زجاج', 'أخرى'];

  // تفعيل العمل بلا إنترنت: بعد أول فتح متصل، يُخزَّن شكل الصفحة في الجهاز فتفتح لاحقاً بدون إنترنت
  (function enableOffline() {
    try {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      var swSrc = "var CACHE='aldiqqa-offline-v1';" +
        "self.addEventListener('install',function(e){self.skipWaiting();});" +
        "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});" +
        "self.addEventListener('fetch',function(e){" +
          "if(e.request.method!=='GET')return;" +
          "e.respondWith(caches.open(CACHE).then(function(c){" +
            "return fetch(e.request).then(function(r){ if(r&&r.ok) c.put(e.request,r.clone()); return r; })" +
            ".catch(function(){ return c.match(e.request).then(function(m){ return m||c.match(self.registration.scope); }); });" +
          "}));" +
        "});";
      var swUrl = URL.createObjectURL(new Blob([swSrc], { type: 'text/javascript' }));
      navigator.serviceWorker.register(swUrl).catch(function () {});
    } catch (e2) {}
  })();

  var patients = [];
  var selectedId = null;
  var mode = 'none';      // none | view | newPatient | editPatient | exam | backup
  var editingExamId = null;
  var query = '';

  var listEl = document.getElementById('plist');
  var detailEl = document.getElementById('detail');
  var countEl = document.getElementById('count');
  var noteEl = document.getElementById('note');
  var noteDueEl = document.getElementById('noteDue');
  var badgeEl = document.getElementById('badge');
  var lockEl = document.getElementById('lock');
  var lockForm = document.getElementById('lockForm');
  var lockPinEl = document.getElementById('lockPin');
  var lockErrEl = document.getElementById('lockErr');
  var btnLockEl = document.getElementById('btnLock');
  var PIN_KEY = 'aldiqqa_pin_v1', FAIL_KEY = 'aldiqqa_pin_fail_v1', UNL = 'aldiqqa_unlocked';
  var lastActive = Date.now();
  var started = false;
  var searchEl = document.getElementById('search');
  var idCounter = 0;
  var noteDraftEl = document.getElementById('noteDraft');
  var TOMB_KEY = 'aldiqqa_deleted_v1', DRAFT_KEY = 'aldiqqa_drafts_v1';
  var pendingRestore = null;   // draft key to restore without asking
  var flushDraft = null;       // saves the open form's draft immediately

  /* ---------- helpers ---------- */
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === false || v === null || v === undefined) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }
  function arDigits(s) {
    return String(s || '')
      .replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x660); })
      .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 0x6F0); });
  }
  function digits(s) { return arDigits(s).replace(/\D/g, ''); }
  function norm(s) {
    return arDigits(s).toLowerCase()
      .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
      .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
      .replace(/\u0629/g, '\u0647')
      .replace(/\u0649/g, '\u064A')
      .replace(/\s+/g, ' ').trim();
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso || '');
  }
  function isoOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function addMonths(iso, n) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return null;
    var y = +m[1], mo = +m[2] - 1 + n, day = +m[3];
    var last = new Date(y, mo + 1, 0).getDate();
    return isoOf(new Date(y, mo, Math.min(day, last)));
  }
  function addDays(iso, n) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    return isoOf(new Date(+m[1], +m[2] - 1, +m[3] + n));
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function waLink(phone) {
    var d = digits(phone);
    if (d.length < 10) return null;
    if (d.charAt(0) === '0') d = '964' + d.slice(1);
    return 'https://wa.me/' + d;
  }
  function sortedExams(p) {
    return p.exams.slice().sort(function (a, b) {
      return (b.date || '').localeCompare(a.date || '') || ((b.created || 0) - (a.created || 0));
    });
  }
  function getPatient(id) {
    for (var i = 0; i < patients.length; i++) if (patients[i].id === id) return patients[i];
    return null;
  }
  function fixExam(e) {
    e.od = e.od || {}; e.os = e.os || {};
    var a = e.od.add, b = e.os.add, legacy = [];
    delete e.od.add; delete e.os.add;
    if (a || b) e.add = (a && b) ? (a === b ? a : a + ' / ' + b) : (a || b);
    ['od', 'os'].forEach(function (k) {

  /* ---------- storage (with safe merge) ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

    try {

    } catch (e) { return []; }
  }
  function readTomb() {
    try { var t = JSON.parse(localStorage.getItem(TOMB_KEY) || '{}'); return (t && typeof t === 'object') ? t : {}; } catch (e) { return {}; }
  }
  function writeTomb(t) {
    var cut = Date.now() - 180 * 86400000;

    try { localStorage.setItem(TOMB_KEY, JSON.stringify(t)); } catch (e) {}
  }

  function mergeExams(a, b, tomb) {
    var map = {}, out = [];
    (a || []).concat(b || []).forEach(function (e) {
      if (tomb['e:' + e.id]) return;
      var cur = map[e.id];
      if (!cur || (e.mod || 0) >= (cur.mod || 0)) map[e.id] = e;
    });
    Object.keys(map).forEach(function (id) { out.push(map[id]); });
    return out;
  }
  function mergePatient(a, b, tomb) {
    var base = (b.updated || 0) >= (a.updated || 0) ? b : a;
    var m = clone(base);
    m.exams = clone(mergeExams(a.exams, b.exams, tomb));
    var r = (b.rmod || 0) >= (a.rmod || 0) ? b : a;
    m.reminded = r.reminded; m.noRemind = r.noRemind;
    m.rmod = Math.max(a.rmod || 0, b.rmod || 0);
    m.updated = Math.max(a.updated || 0, b.updated || 0);
    return m;
  }
  function mergeLists(a, b, tomb) {
    a = clone(a); b = clone(b);
    var map = {}, order = [];
    a.forEach(function (p) { if (!tomb['p:' + p.id]) { map[p.id] = p; order.push(p.id); } });
    b.forEach(function (p) {
      if (tomb['p:' + p.id]) return;
      if (map[p.id]) map[p.id] = mergePatient(map[p.id], p, tomb);
      else { map[p.id] = p; order.push(p.id); }
    });
    return order.map(function (id) {
      var p = map[id];
      p.exams = p.exams.filter(function (e) { return !tomb['e:' + e.id]; });

    });
  }
  // put merged data into the live objects (keeps references valid)
  function adoptList(list) {
    var keep = {};
    list.forEach(function (m) {
      keep[m.id] = true;
      var cur = getPatient(m.id);
      if (cur) {
        Object.keys(cur).forEach(function (k) { delete cur[k]; });
        Object.keys(m).forEach(function (k) { cur[k] = m[k]; });

  }
  function load() { patients = readStored(); }
  function save() {
    try {
      var merged = mergeLists(readStored(), patients, readTomb());
      localStorage.setItem(KEY, JSON.stringify(merged));
      adoptList(merged);
      maybeSnapshot();
      return true;
    } catch (e) {
      alert('تعذّر حفظ البيانات على هذا الجهاز. تأكد من أن المتصفح لا يعمل في وضع التصفح الخاص ومن وجود مساحة كافية.');

  }
  function ensurePatient(p) {

  /* ---------- restore = merge (never wipes existing records) ---------- */
  function restoreMerge(arr) {

      var t = readTomb();
      incoming.forEach(function (p) {
        delete t['p:' + p.id];
        p.exams.forEach(function (e) { delete t['e:' + e.id]; });
      });
      writeTomb(t);

  /* ---------- automatic snapshots inside the device (IndexedDB) ---------- */
  var SNAP_MAX = 10, SNAP_EVERY = 12 * 3600 * 1000, lastSnapCheck = 0;
  function idbOpen() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('no idb')); return; }
      var r = indexedDB.open('aldiqqa_snaps', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('snaps', { keyPath: 'ts' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function snapList() {
    return idbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var q = db.transaction('snaps', 'readonly').objectStore('snaps').getAll();
        q.onsuccess = function () { res((q.result || []).sort(function (a, b) { return b.ts - a.ts; })); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }
  function snapPut(rec) {
    return idbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('snaps', 'readwrite');
        tx.objectStore('snaps').put(rec);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function snapPrune() {
    return snapList().then(function (list) {
      if (list.length <= SNAP_MAX) return;
      return idbOpen().then(function (db) {
        var st = db.transaction('snaps', 'readwrite').objectStore('snaps');
        list.slice(SNAP_MAX).forEach(function (r) { st.delete(r.ts); });
      });
    });
  }
  function takeSnapshot(label) {
    if (!patients.length) return Promise.resolve();
    var exams = 0;
    patients.forEach(function (p) { exams += p.exams.length; });
    return snapPut({ ts: Date.now(), label: label || 'تلقائية', patients: patients.length, exams: exams, data: JSON.stringify(patients) })
      .then(snapPrune).catch(function () {});
  }
  function maybeSnapshot() {
    var now = Date.now();
    if (now - lastSnapCheck < 5 * 60 * 1000) return;
    lastSnapCheck = now;
    snapList().then(function (list) {
      var auto = list.filter(function (r) { return r.label === 'تلقائية'; })[0];
      if (!auto || now - auto.ts > SNAP_EVERY) takeSnapshot('تلقائية');
    }).catch(function () {});
  }

  /* ---------- drafts (unsaved form contents) ---------- */
  function readDrafts() {
    try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); return (d && typeof d === 'object') ? d : {}; } catch (e) { return {}; }
  }
  function writeDrafts(d) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch (e) {} }
  function setDraft(key, obj) { var d = readDrafts(); obj.ts = Date.now(); d[key] = obj; writeDrafts(d); }
  function delDraft(key) { var d = readDrafts(); if (d[key]) { delete d[key]; writeDrafts(d); } }
  // هل المسودة مكرّرة لما هو محفوظ فعلاً أو لم يعد لها معنى؟ إن كانت كذلك تُحذف تلقائياً
  function sameExam(v, e) {
    var ok = (v.date || '') === (e.date || '') && (v.add || '').trim() === (e.add || '') &&
      (v.pd || '').trim() === (e.pd || '') && (v.notes || '').trim() === (e.notes || '') && !!v.done === !!e.done;
    COLS.forEach(function (c) {
      if (((v.od || {})[c] || '').trim() !== ((e.od || {})[c] || '')) ok = false;
      if (((v.os || {})[c] || '').trim() !== ((e.os || {})[c] || '')) ok = false;
    });
    return ok;
  }
  function draftIsStale(x) {
    if (!x || !x.v) return true;
    var v = x.v;
    if (x.type === 'patient') {
      var name = (v.name || '').trim(), phone = (v.phone || '').trim();
      if (x.pid) {
        var p = getPatient(x.pid);
        return !p || (name === p.name && phone === p.phone && (v.age || '').trim() === p.age && (v.notes || '').trim() === p.notes);
      }
      if (!name && !phone && !(v.age || '').trim() && !(v.notes || '').trim()) return true;
      return patients.some(function (q) { return q.name === name && q.phone === phone; });
    }
    var pt = getPatient(x.pid);
    if (!pt) return true;
    if (x.eid && !pt.exams.some(function (e) { return e.id === x.eid; })) return true;
    return pt.exams.some(function (e) { return (!x.eid || e.id === x.eid) && sameExam(v, e); });
  }

      out.push({ key: k, d: x });

  function dueInfo(p) {

    else if (due <= today()) status = 'due';

  /* ---------- numeric inputs ---------- */
  // يعرض الإضافة بإشارة + (للقيم القديمة المحفوظة بدون إشارة)
  function addSign(v) {
    v = String(v || '').trim();
    return /^\d/.test(v) ? '+' + v : v;
  }
  function cleanNum(v, kind) {
    v = arDigits(v).replace(/[\u060C\u066B,]/g, '.').replace(/[\u2212\u2013\u2014]/g, '-');
    if (kind === 'int') return v.replace(/\D/g, '').slice(0, 3);
    if (kind === 'add') {
      if (/[\/\s]/.test(v)) return v;               // قيمة قديمة مركّبة: لا تُعدَّل
      v = v.replace(/[^0-9.]/g, '');
      var j = v.indexOf('.');
      if (j > -1) v = v.slice(0, j + 1) + v.slice(j + 1).replace(/\./g, '');
      return v ? '+' + v : '';                       // إضافة + تلقائياً
    }
    var sign = '';
    if (kind === 'dec' && /^[+\-]/.test(v.trim())) sign = v.trim().charAt(0);
    v = v.replace(/[^0-9.]/g, '');
    var i = v.indexOf('.');
    if (i > -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '');
    return sign + v;
  }
  // يحوّل الاختصار الذي يكتبه المستخدم (مثل 5 أو 15.5) إلى سعر كامل بالدينار العراقي
  function shorthandToIQD(raw) {
    raw = arDigits(raw).replace(/[\u060C\u066B,]/g, '.').replace(/[^0-9.]/g, '');
    if (!raw) return 0;
    var parts = raw.split('.');
    var whole = parseInt(parts[0] || '0', 10) || 0;
    var frac = (parts[1] || '').slice(0, 3);
    while (frac.length && frac.length < 3) frac += '0';
    return whole * 1000 + (frac ? parseInt(frac, 10) : 0);
  }
  function iqdToShorthand(n) {
    n = parseInt(n, 10) || 0;
    if (!n) return '';
    var whole = Math.floor(n / 1000), rem = n % 1000;
    if (!rem) return String(whole);
    var frac = String(rem).padStart(3, '0').replace(/0+$/, '');
    return whole + (frac ? '.' + frac : '');
  }
  function fmtIQD(n) { return (parseInt(n, 10) || 0).toLocaleString('en-US'); }
  // يقرأ حقل السعر سواء كان معروضاً بصيغة مختصرة (أثناء الكتابة) أو منسّقاً بفواصل (بعد الخروج من الحقل)
  function parsePriceField(inp) {
    var raw = String(inp.value || '').trim();
    if (!raw) return 0;
    if (raw.indexOf(',') > -1 || /د\.ع/.test(raw)) return parseInt(arDigits(raw).replace(/[^0-9]/g, ''), 10) || 0;
    return shorthandToIQD(raw);
  }
  // حقل نص حر مع قائمة اقتراحات مخصّصة (بديل عن select/datalist الأصليين لضبط الشكل ومنع مشاكل تعبئة المتصفح التلقائية)

    idCounter++;

    var inp = h('input', { class: 'inp', type: 'text', id: id, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', value: value || '', 'aria-label': label });
    var box = h('div', { class: 'suggest-box', hidden: true });
    function renderOpts() {
      var f = inp.value.trim();
      var list = options.filter(function (o) { return !f || o.indexOf(f) > -1; });
      box.textContent = '';
      if (!list.length) { box.hidden = true; return; }
      list.forEach(function (o) {
        box.appendChild(h('button', { type: 'button', class: 'suggest-item', text: o, onmousedown: function (ev) {
          ev.preventDefault();
          inp.value = o; box.hidden = true;
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          inp.dispatchEvent(new Event('change', { bubbles: true }));
        } }));
      });
      box.hidden = false;
    }
    inp.addEventListener('focus', renderOpts);

    var wrap = h('div', { class: 'field suggest' }, h('label', { 'for': id, text: label }), inp, box);
    wrap._input = inp;
    return wrap;
  }
  function priceInput(value) {
    var inp = h('input', { class: 'inp ltr', type: 'text', inputmode: 'decimal', autocomplete: 'off',
      'aria-label': 'سعر النظارة بالدينار العراقي', value: value ? fmtIQD(value) + ' د.ع' : '' });
    inp.addEventListener('focus', function () { var v = parsePriceField(inp); inp.value = v ? iqdToShorthand(v) : ''; inp.select(); });
    inp.addEventListener('blur', function () {
      var v = parsePriceField(inp);
      inp.value = v ? fmtIQD(v) + ' د.ع' : '';
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    });

  }
  function numInput(kind, value, label) {
    var inp = h('input', { class: 'inp ltr rxin', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
      inputmode: kind === 'int' ? 'numeric' : 'decimal', enterkeyhint: 'next', 'aria-label': label, value: value || '' });
    inp.addEventListener('input', function () {
      var c = cleanNum(inp.value, kind);

    if (kind === 'dec' || kind === 'add') {
      // عند الخروج من الحقل: إتمام العدد إلى مرتبتين عشريتين (وعلامة + دائماً لحقل الإضافة البصرية)
      inp.addEventListener('blur', function () {
        var v = inp.value.trim();
        if (!v || v === '+' || v === '-') return;
        var sign = '';
        if (v.charAt(0) === '+' || v.charAt(0) === '-') { sign = v.charAt(0); v = v.slice(1); }
        if (kind === 'add') sign = '+';
        if (v.indexOf('.') === -1) v = (v || '0') + '.00';
        else {

          while (frac.length < 2) frac += '0';

  }

  /* ---------- PIN lock ---------- */
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  function getPin() {
    try { var r = localStorage.getItem(PIN_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  }
  function cyrb53(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  function hashPin(pin, salt, weak) {
    var data = salt + ':' + pin;
    if (!weak && window.crypto && crypto.subtle && window.TextEncoder && window.Promise) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)).then(function (buf) {
        return 's:' + Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    }
    return Promise.resolve('w:' + cyrb53(data));
  }
  function checkPin(pin) {
    var cfg = getPin();
    if (!cfg) return Promise.resolve(true);
    return hashPin(pin, cfg.salt, cfg.hash.charAt(0) === 'w').then(function (hx) { return hx === cfg.hash; });
  }
  function setPin(pin) {
    var salt = uid();
    return hashPin(pin, salt, false).then(function (hx) {
      try { localStorage.setItem(PIN_KEY, JSON.stringify({ salt: salt, hash: hx })); return true; } catch (e) { return false; }
    });
  }
  function removePin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }
  function getFail() {
    try { return JSON.parse(localStorage.getItem(FAIL_KEY) || '{"n":0,"until":0}'); } catch (e) { return { n: 0, until: 0 }; }
  }
  function setFail(f) { try { localStorage.setItem(FAIL_KEY, JSON.stringify(f)); } catch (e) {} }
  function waitLeft() { return Math.max(0, Math.ceil((getFail().until - Date.now()) / 1000)); }
  function tryPin(pin) {
    var w = waitLeft();
    if (w > 0) return Promise.resolve({ ok: false, wait: w });
    return checkPin(pin).then(function (ok) {
      if (ok) setFail({ n: 0, until: 0 });
      else {
        var f = getFail(); f.n = (f.n || 0) + 1;
        if (f.n >= 5) { f.until = Date.now() + 30000; f.n = 0; }
        setFail(f);
      }
      return { ok: ok, wait: waitLeft() };
    });
  }

        : 'غير مفعّل. فعّله حتى لا يستطيع من يمسك الجهاز فتح سجلات المرضى. الرمز خاص بهذا الجهاز فقط، وإذا نسيته لا يمكن استرجاعه، وقد تضطر لمسح بيانات المتصفح فتضيع السجلات إن لم تكن لديك نسخة احتياطية.' }),

    var last = lastBackup();
    var fileI = h('input', { type: 'file', accept: '.json,application/json', class: 'inp' });
    fileI.addEventListener('change', function () {
      var f = fileI.files && fileI.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          var arr = Array.isArray(d) ? d : d.patients;
          if (!Array.isArray(arr) || arr.some(function (x) { return !x || !x.id || !x.name; })) throw new Error('bad');
          if (confirm('سيتم دمج ' + arr.length + ' مريض من النسخة مع السجلات الحالية (' + patients.length + ' مريض). لن يُحذف شيء، ويُعتمد الأحدث لكل مريض. هل تريد المتابعة؟')) {
            var before = patients.length;
            restoreMerge(arr).then(function (ok) {
              if (!ok) return;
              selectedId = null; mode = 'none'; refresh();
              alert('تم الدمج. أُضيف ' + (patients.length - before) + ' مريض جديد.');
            });
          }
        } catch (err) { alert('هذا الملف ليس نسخة احتياطية صالحة.'); }
        fileI.value = '';
      };
      r.readAsText(f);
    });

    return h('div', {},
      h('button', { type: 'button', class: 'btn back', text: '→ رجوع للقائمة', onclick: back }),
      h('div', { class: 'card' },
        h('h2', { text: 'النسخة الاحتياطية' }),
        h('p', { class: 'meta', text: patients.length + ' مريض · ' + exams + ' فحص' }),
        h('p', { class: 'meta', text: last ? 'آخر نسخة: ' + new Date(last).toLocaleDateString('en-GB') : 'لم تُحفظ نسخة بعد' }),
        h('p', { class: 'notes', text: 'السجلات محفوظة داخل متصفح هذا الجهاز فقط. إذا مُسحت بيانات المتصفح أو تعطّل الجهاز ضاعت السجلات، لذلك احفظ نسخة كل أسبوع وأرسلها لنفسك على واتساب أو انسخها إلى مكان آخر.' }),
        h('div', { class: 'form-actions', style: 'margin-top:1rem' },
          h('button', { type: 'button', class: 'btn btn-primary', text: 'تنزيل نسخة احتياطية', onclick: downloadBackup }))),
      h('div', { class: 'card' },
        h('h3', { text: 'استرجاع من نسخة' }),
        h('p', { class: 'hint', text: 'اختر ملف النسخة الاحتياطية (.json). يُدمج مع السجلات الحالية ولا يمحو شيئاً.' }),
        h('div', { style: 'height:.6rem' }),
        fileI),
      snapshotsCard(),
      pinCard());
  }

  function downloadBackup() {
    var data = { app: 'aldiqqa-patients', version: 1, exported: new Date().toISOString(), patients: patients };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'aldiqqa-backup-' + today() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    try { localStorage.setItem(BK, String(Date.now())); } catch (e) {}
    updateNote();
  }

  function renderDetail() {
    flushDraft = null;
    detailEl.textContent = '';
    var p = getPatient(selectedId);
    if (mode === 'backup') detailEl.appendChild(backupView());
    else if (mode === 'reminders') detailEl.appendChild(remindersView());
    else if (mode === 'newPatient') detailEl.appendChild(patientForm(null));
    else if (!p) detailEl.appendChild(homeView());
    else if (mode === 'examExt') detailEl.appendChild(examForm(p, null, true));
    else if (mode === 'editPatient') detailEl.appendChild(patientForm(p));
    else if (mode === 'image') {
      var ie = null;
      for (var q = 0; q < p.exams.length; q++) if (p.exams[q].id === editingExamId) ie = p.exams[q];
      if (ie) detailEl.appendChild(imageView(p, ie)); else detailEl.appendChild(viewPatient(p));
    } else if (mode === 'exam') {
      var ex = null;
      if (editingExamId) for (var i = 0; i < p.exams.length; i++) if (p.exams[i].id === editingExamId) ex = p.exams[i];
      detailEl.appendChild(examForm(p, ex));
    } else detailEl.appendChild(viewPatient(p));
  }

  function computeStats() {
    var totalExams = 0, pending = 0, readyNotNotified = 0, examsToday = 0;
    var todayStr = today();
    patients.forEach(function (p) {
      p.exams.forEach(function (e) {
        totalExams++;
        if (!e.done) pending++;
        if (e.done && !e.notified) readyNotNotified++;
        if (e.date === todayStr) examsToday++;
      });
    });
    return { totalPatients: patients.length, totalExams: totalExams, pending: pending,
      readyNotNotified: readyNotNotified, examsToday: examsToday, dueToday: allDue('due').length };
  }
  function homeView() {
    var s = computeStats();
    function stat(n, label) { return h('div', { class: 'stat' }, h('b', { text: String(n) }), h('span', { text: label })); }
    return h('div', {},
      h('div', { class: 'card home' },
        h('div', { class: 'icon' }, '👓'),
        h('h2', { text: 'مرحباً بك في سجل فحوصات النظر' }),
        h('p', { text: SHOP.name + ' — أضف مريضاً جديداً أو اختر مريضاً من القائمة على اليمين' }),
        h('button', { type: 'button', class: 'btn btn-primary', text: '+ إضافة مريض جديد', onclick: function () { selectedId = null; mode = 'newPatient'; refresh(); } }),
        h('h3', { class: 'section-title', text: 'إحصائيات سريعة' }),
        h('div', { class: 'stats' },
          stat(s.totalPatients, 'إجمالي المرضى'),
          stat(s.totalExams, 'إجمالي الفحوصات'),
          stat(s.pending, 'نظارات قيد العمل'),
          stat(s.readyNotNotified, 'جاهزة لم يُبلَّغ المريض'),
          stat(s.examsToday, 'فحوصات اليوم'),
          stat(s.dueToday, 'تذكيرات مستحقة اليوم'))));
  }

  function refresh(keepScroll) {
    var y = window.pageYOffset;
    document.body.classList.toggle('detail-open', mode !== 'none');
    renderList();
    renderDetail();
    updateNote();
    window.scrollTo(0, keepScroll === true ? y : 0);
  }
  function select(id) { selectedId = id; editingExamId = null; mode = 'view'; refresh(); }
  function back() { selectedId = null; editingExamId = null; mode = 'none'; refresh(); }

  /* ---------- events ---------- */
  searchEl.addEventListener('input', function () { query = searchEl.value; renderList(); });
  document.getElementById('btnHome').addEventListener('click', function () { back(); });
  document.getElementById('btnAddSide').addEventListener('click', function () { selectedId = null; mode = 'newPatient'; refresh(); });
  document.getElementById('btnBackup').addEventListener('click', function () { mode = 'backup'; refresh(); });
  noteEl.addEventListener('click', function () { mode = 'backup'; refresh(); });
  document.getElementById('btnRemind').addEventListener('click', function () { selectedId = null; mode = 'reminders'; refresh(); });
  noteDueEl.addEventListener('click', function () { selectedId = null; mode = 'reminders'; refresh(); });

  noteDraftEl.addEventListener('click', function () {
    var l = draftList();
    if (!l.length) { refresh(true); return; }
    if (confirm('لديك مسودة لم تُحفظ. اضغط «موافق» لاسترجاعها، أو «إلغاء» للخيارات الأخرى.')) openDraft(l[0]);
    else if (confirm('هل تريد حذف هذه المسودة نهائياً؟ (موافق = حذف، إلغاء = إبقاؤها)')) { delDraft(l[0].key); refresh(true); }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && flushDraft) flushDraft(); });
  window.addEventListener('pagehide', function () { if (flushDraft) flushDraft(); });
  // another window/tab changed the records: pick up its changes
  window.addEventListener('storage', function (ev) {
    if (ev.key !== KEY && ev.key !== TOMB_KEY) return;
    load();
    if (document.body.classList.contains('locked')) return;
    var inForm = (mode === 'newPatient' || mode === 'editPatient' || mode === 'exam');
    if (selectedId && !getPatient(selectedId) && !inForm) { selectedId = null; mode = 'none'; document.body.classList.remove('detail-open'); }
    renderList(); updateNote();
    if (!inForm && mode !== 'image') { var f = flushDraft; renderDetail(); flushDraft = f; }
  });

  btnLockEl.addEventListener('click', lockNow);
  lockForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    tryPin(digits(lockPinEl.value)).then(function (r) {
      if (r.ok) { ssSet(UNL, '1'); lastActive = Date.now(); start(); }
      else {
        lockPinEl.value = '';
        lockErrEl.textContent = r.wait > 0 ? 'محاولات كثيرة خاطئة. انتظر ' + r.wait + ' ثانية.' : 'الرمز غير صحيح.';
      }
    });
  });

  load();
  if (getPin() && ssGet(UNL) !== '1') showLock(); else start();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
</body>
</html>
