<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الدقة للبصريات</title>
<style>
  :root { --bg:#FBFBFA; --surface:#FFFFFF; --ink:#15171A; --muted:#565C63; --line:#D5D9DD; --accent:#A4501A; --on-accent:#FFFFFF; --danger:#B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111315; --surface:#1B1E21; --ink:#F0F0EC; --muted:#A3A9AF; --line:#2E3338; --accent:#E59A5C; --on-accent:#111315; --danger:#F2857D; } }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", Tahoma, Arial, sans-serif; display: grid; place-items: center; padding: 1rem; }
  form { width: min(22rem, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.5rem 1.25rem; text-align: center; }
  h1 { font-size: 1.3rem; margin-bottom: .25rem; }
  p.hint { color: var(--muted); font-size: .95rem; margin-bottom: 1rem; }
  input[type=password] { width: 100%; min-height: 3rem; border: 1.5px solid var(--line); border-radius: 10px; padding: .5rem .8rem; background: var(--bg); color: var(--ink); font-size: 1.1rem; text-align: center; direction: ltr; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label.rem { display: flex; gap: .5rem; align-items: center; justify-content: center; margin: .9rem 0; font-size: .95rem; color: var(--muted); cursor: pointer; }
  label.rem input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); }
  button { width: 100%; min-height: 3rem; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 1rem; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  #msg { min-height: 1.6rem; margin-top: .75rem; color: var(--danger); font-size: .95rem; }
</style>
</head>
<body>
<form id="f" novalidate>
  <h1>الدقة للبصريات</h1>
  <p class="hint">أدخل كلمة السر للمتابعة</p>
  <input type="password" id="pw" autocomplete="off" aria-label="كلمة السر" autofocus>
  <label class="rem"><input type="checkbox" id="rem"> تذكّرني على هذا الجهاز</label>
  <button type="submit" id="go">دخول</button>
  <p id="msg" role="alert"></p>
</form>

  var LS = 'aldiqqa_gate_v1';
  var f = document.getElementById('f'), pw = document.getElementById('pw'), rem = document.getElementById('rem'),
      go = document.getElementById('go'), msg = document.getElementById('msg');

  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function norm(s) {
    return String(s).replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x660); })
                    .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 0x6F0); });
  }
  function decrypt(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)).then(function (buf) {
      return new TextDecoder().decode(buf);
    });
  }
  function derive(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function openApp(html) { document.open(); document.write(html); document.close(); }

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'هذا المتصفح لا يدعم فتح الصفحة. افتحها من متصفح حديث وعبر الرابط الآمن (https).';
    go.disabled = true;
    return;
  }

  // remembered device
  try {
    var saved = JSON.parse(localStorage.getItem(LS) || 'null');
    if (saved && saved.salt === P.salt && saved.k) {
      crypto.subtle.importKey('raw', b64(saved.k), { name: 'AES-GCM' }, false, ['decrypt'])
        .then(decrypt).then(openApp)
        .catch(function () { try { localStorage.removeItem(LS); } catch (e) {} });
    }
  } catch (e) {}

  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var password = norm(pw.value);
    if (!password) { msg.textContent = 'اكتب كلمة السر.'; return; }
    msg.textContent = '';
    go.disabled = true; go.textContent = 'جارٍ التحقق...';
    var keyRef;
    derive(password).then(function (key) { keyRef = key; return decrypt(key); }).then(function (html) {

        return crypto.subtle.exportKey('raw', keyRef).then(function (raw) {
          try { localStorage.setItem(LS, JSON.stringify({ salt: P.salt, k: toB64(raw) })); } catch (e) {}

        });
      }
      return html;
    }).then(openApp).catch(function () {

      pw.value = ''; pw.focus();
      go.disabled = false; go.textContent = 'دخول';
    });
  });
