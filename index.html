<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>سجل الفحوصات | الدقة للبصريات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFBFA; --alt: #EEF1F3; --surface: #FFFFFF;
    --ink: #15171A; --muted: #565C63; --line: #D5D9DD;
    --accent: #A4501A; --on-accent: #FFFFFF; --danger: #B3261E;
    --display: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
    --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315; --alt: #191C1F; --surface: #1B1E21;
      --ink: #F0F0EC; --muted: #A3A9AF; --line: #2E3338;
      --accent: #E59A5C; --on-accent: #111315; --danger: #F2857D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111315; --alt: #191C1F; --surface: #1B1E21;
    --ink: #F0F0EC; --muted: #A3A9AF; --line: #2E3338;
    --accent: #E59A5C; --on-accent: #111315; --danger: #F2857D;
  }

  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* Top bar */
  .bar { background: var(--surface); border-bottom: 1px solid var(--line); padding: .7rem 1.25rem; display: flex; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .bar h1 { font-family: var(--display); font-weight: 800; font-size: 1.2rem; line-height: 1.5; }
  .bar .shop { color: var(--muted); font-size: .9rem; }
  .bar-actions { margin-inline-start: auto; display: flex; gap: .5rem; flex-wrap: wrap; }

  .btn { min-height: 2.9rem; padding: .6rem 1.15rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn-small { min-height: 2.4rem; padding: .3rem .85rem; font-size: .95rem; }

  /* Layout */
  .cols { display: grid; grid-template-columns: minmax(18rem, 24rem) 1fr; min-height: calc(100vh - 4.4rem); }
  .list-col { border-inline-end: 1px solid var(--line); padding: 1rem; }
  .detail-col { padding: 1.25rem clamp(1rem, 3vw, 2rem) 3rem; min-width: 0; }
  .back { display: none; margin-bottom: 1rem; }

  .inp { width: 100%; min-height: 3rem; border: 1.5px solid var(--line); border-radius: 10px; padding: .5rem .8rem; background: var(--surface); }
  .card .inp { background: var(--bg); }
  .inp:focus-visible { outline-offset: 1px; border-color: var(--accent); }
  textarea.inp { min-height: 5.5rem; resize: vertical; }

  .count { color: var(--muted); font-size: .9rem; margin-top: .75rem; }
  .note { display: block; width: 100%; text-align: start; margin-top: .75rem; padding: .6rem .8rem; border: 1.5px solid var(--accent); border-radius: 10px; background: transparent; cursor: pointer; font-size: .95rem; }
  .plist { list-style: none; padding: 0; margin-top: .5rem; display: grid; gap: .5rem; }
  .pitem { display: block; width: 100%; text-align: start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: .7rem .9rem; cursor: pointer; }
  .pitem:hover { border-color: var(--accent); }
  .pitem[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pitem b { display: block; font-weight: 600; }
  .pitem span { display: block; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); padding: 1rem .25rem; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  .card h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1.5; }
  .card h3 { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
  .head { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: flex-start; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .meta { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; color: var(--muted); margin-top: .25rem; }
  .meta a { text-underline-offset: 4px; }
  .notes { margin-top: .5rem; }
  .exam-top { display: flex; flex-wrap: wrap; gap: .5rem 1rem; justify-content: space-between; align-items: center; }
  .tag { display: inline-block; margin-inline-start: .6rem; padding: .05rem .6rem; font-size: .8rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-family: var(--body); font-weight: 600; }
  .section-title { font-family: var(--display); font-weight: 600; margin: 1.5rem 0 .75rem; }

  .tablewrap { overflow-x: auto; }
  table.rx { width: 100%; border-collapse: collapse; text-align: center; margin-top: .6rem; direction: ltr; }
  .rx th, .rx td { border: 1px solid var(--line); padding: .4rem .45rem; }
  .rx th { background: var(--alt); font-weight: 600; font-size: .85rem; }
  .rx td.eye { background: var(--alt); font-weight: 600; white-space: nowrap; }
  .rx td.eye small { color: var(--muted); font-weight: 400; margin-inline-start: .3rem; }
  .rx .inp { min-width: 4rem; text-align: center; padding-inline: .3rem; }
  .extra { margin-top: .6rem; color: var(--muted); }
  .extra b { color: var(--ink); font-weight: 600; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-weight: 500; font-size: .95rem; margin-bottom: .25rem; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: .6rem; }
  .error { color: var(--danger); font-weight: 500; margin-bottom: .75rem; }
  .form-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }

  .badge { display: inline-block; min-width: 1.4rem; padding: 0 .45rem; margin-inline-start: .4rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: .85rem; line-height: 1.5rem; text-align: center; }
  .remind p { margin-bottom: .6rem; }
  .rrow { display: flex; flex-wrap: wrap; gap: .6rem 1rem; justify-content: space-between; align-items: center; }
  .rrow small { display: block; color: var(--muted); }

  .glasses { display: flex; flex-wrap: wrap; gap: .5rem 1rem; justify-content: space-between; align-items: center; margin-top: .9rem; padding-top: .8rem; border-top: 1px dashed var(--line); }
  .ok { color: var(--accent); font-weight: 600; }
  .flag { color: var(--accent); font-weight: 600; }
  .check { display: flex; align-items: center; gap: .6rem; font-weight: 500; margin: .25rem 0 1rem; cursor: pointer; }
  .check input { width: 1.4rem; height: 1.4rem; accent-color: var(--accent); }
  canvas.examimg { display: block; width: 100%; max-width: 34rem; height: auto; border: 1px solid var(--line); border-radius: 8px; margin: 0 auto; background: #fff; }

  .lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 1rem; }
  .lockcard { width: min(22rem, 100%); text-align: center; margin: 0; }
  .lockcard .inp { text-align: center; letter-spacing: .4em; font-size: 1.4rem; margin: .75rem 0; }
  .lockcard .error { min-height: 1.6rem; margin: 0 0 .5rem; }
  body.locked .bar, body.locked .cols, body.locked .foot { display: none; }

  .foot { color: var(--muted); font-size: .85rem; padding: 1rem 1.25rem 2rem; text-align: center; }

  @media (max-width: 52rem) {
    .cols { grid-template-columns: 1fr; }
    .detail-col { display: none; }
    body.detail-open .detail-col { display: block; }
    body.detail-open .list-col { display: none; }
    .back { display: inline-flex; align-items: center; }
    .list-col { border-inline-end: 0; }
  }
  @media (max-width: 34rem) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="lock" id="lock" hidden>
  <form class="card lockcard" id="lockForm" novalidate>
    <h2>سجل فحوصات النظر</h2>
    <p class="hint">أدخل الرمز السري للدخول</p>
    <input class="inp ltr" id="lockPin" type="password" inputmode="numeric" autocomplete="off" aria-label="الرمز السري">
    <p class="error" id="lockErr" role="alert"></p>
    <button class="btn btn-primary" type="submit" style="width:100%">دخول</button>
  </form>
</div>

<div class="bar">
  <h1>سجل فحوصات النظر</h1>
  <span class="shop">الدقة للبصريات</span>
  <div class="bar-actions">
    <button class="btn btn-primary" id="btnNew" type="button">+ مريض جديد</button>
    <button class="btn" id="btnRemind" type="button">التذكيرات<span class="badge" id="badge" hidden></span></button>
    <button class="btn" id="btnBackup" type="button">الإعدادات</button>
    <button class="btn" id="btnLock" type="button" hidden>🔒 قفل</button>
  </div>
</div>

<div class="cols">
  <aside class="list-col">
    <input class="inp" id="search" type="search" placeholder="ابحث بالاسم أو رقم الهاتف" autocomplete="off" aria-label="بحث عن مريض">
    <button class="note" id="noteDue" type="button" hidden></button>
    <button class="note" id="note" type="button" hidden></button>
    <div class="count" id="count" aria-live="polite"></div>
    <ul class="plist" id="plist"></ul>
  </aside>
  <main class="detail-col" id="detail"></main>
</div>

<p class="foot">السجلات محفوظة على هذا الجهاز فقط داخل المتصفح، ولا تُرسل إلى أي جهة. خذ نسخة احتياطية بانتظام.</p>

<script>
(function () {
  'use strict';

  var KEY = 'aldiqqa_patients_v1';
  var BK = 'aldiqqa_last_backup_v1';
  /* ===== إعدادات التذكير ===== */
  var REMIND_MONTHS = 6;   // عدد الأشهر بعد آخر فحص
  var IDLE_MS = 5 * 60 * 1000;   // القفل التلقائي بعد 5 دقائق من عدم الاستخدام
  function remindMessage(p) {
    return 'السلام عليكم ' + p.name + '،\n' +
      'نذكّرك بأنه مرّت ' + REMIND_MONTHS + ' أشهر على آخر فحص نظر لك في الدقة للبصريات، وقد حان موعد إعادة الفحص للاطمئنان على سلامة نظرك.\n' +
      'يسعدنا استقبالك في مجمع نور العباس الطبي، كربلاء، من ٤ عصراً حتى ١٠ ليلاً.\n' +
      'للحجز رد على هذه الرسالة.';
  }
  var SHOP = {
    name: 'الدقة للبصريات',
    tagline: 'نظّارات طبية وفحص النظر',
    address: 'كربلاء المقدسة، مجمع نور العباس الطبي، مجاور مستشفى العباس (ع) الأهلي',
    phone: '07732906486',
    hours: 'من الساعة 4:00 عصراً إلى الساعة 10:00 ليلاً'
  };
  function readyMessage(p) {
    return 'السلام عليكم ' + p.name + '،\n' +
      'تم اكتمال عمل النظارة، يرجى التوجه إلى العيادة لغرض الاستلام.\n' +
      'مع الشكر والتقدير.\n\n' +
      SHOP.name + '\n' +
      'أوقات الدوام: ' + SHOP.hours + '.';
  }
  /* ========================== */

  var COLS = ['sph', 'cyl', 'axis', 'add', 'va'];
  var HEADS = ['SPH', 'CYL', 'AXIS', 'ADD', 'VA'];

  var patients = [];
  var selectedId = null;
  var mode = 'none';      // none | view | newPatient | editPatient | exam | backup
  var editingExamId = null;
  var query = '';

  var listEl = document.getElementById('plist');
  var detailEl = document.getElementById('detail');
  var countEl = document.getElementById('count');
  var noteEl = document.getElementById('note');
  var noteDueEl = document.getElementById('noteDue');
  var badgeEl = document.getElementById('badge');
  var lockEl = document.getElementById('lock');
  var lockForm = document.getElementById('lockForm');
  var lockPinEl = document.getElementById('lockPin');
  var lockErrEl = document.getElementById('lockErr');
  var btnLockEl = document.getElementById('btnLock');
  var PIN_KEY = 'aldiqqa_pin_v1', FAIL_KEY = 'aldiqqa_pin_fail_v1', UNL = 'aldiqqa_unlocked';
  var lastActive = Date.now();
  var started = false;
  var searchEl = document.getElementById('search');
  var idCounter = 0;

  /* ---------- helpers ---------- */
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === false || v === null || v === undefined) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }
  function arDigits(s) {
    return String(s || '')
      .replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x660); })
      .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 0x6F0); });
  }
  function digits(s) { return arDigits(s).replace(/\D/g, ''); }
  function norm(s) {
    return arDigits(s).toLowerCase()
      .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
      .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
      .replace(/\u0629/g, '\u0647')
      .replace(/\u0649/g, '\u064A')
      .replace(/\s+/g, ' ').trim();
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso || '');
  }
  function isoOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function addMonths(iso, n) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return null;
    var y = +m[1], mo = +m[2] - 1 + n, day = +m[3];
    var last = new Date(y, mo + 1, 0).getDate();
    return isoOf(new Date(y, mo, Math.min(day, last)));
  }
  function addDays(iso, n) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    return isoOf(new Date(+m[1], +m[2] - 1, +m[3] + n));
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function waLink(phone) {
    var d = digits(phone);
    if (d.length < 10) return null;
    if (d.charAt(0) === '0') d = '964' + d.slice(1);
    return 'https://wa.me/' + d;
  }
  function sortedExams(p) {
    return p.exams.slice().sort(function (a, b) {
      return (b.date || '').localeCompare(a.date || '') || ((b.created || 0) - (a.created || 0));
    });
  }
  function getPatient(id) {
    for (var i = 0; i < patients.length; i++) if (patients[i].id === id) return patients[i];
    return null;
  }
  function fixPatient(p) {
    p.exams = Array.isArray(p.exams) ? p.exams : [];
    p.name = String(p.name || '');
    p.phone = String(p.phone || '');
    p.age = String(p.age || '');
    p.notes = String(p.notes || '');
    p.updated = p.updated || p.created || Date.now();
    return p;
  }
  function field(label, input, cls) {
    idCounter++;
    input.id = 'f' + idCounter;
    return h('div', { class: 'field ' + (cls || '') }, h('label', { 'for': input.id, text: label }), input);
  }

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var arr = raw ? JSON.parse(raw) : [];
      patients = Array.isArray(arr) ? arr.map(fixPatient) : [];
    } catch (e) { patients = []; }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(patients));
      return true;
    } catch (e) {
      alert('تعذّر حفظ البيانات على هذا الجهاز. تأكد من أن المتصفح لا يعمل في وضع التصفح الخاص ومن وجود مساحة كافية.');
      return false;
    }
  }
  function lastBackup() {
    try { return Number(localStorage.getItem(BK) || 0); } catch (e) { return 0; }
  }

  /* ---------- reminders ---------- */
  function dueInfo(p) {
    var last = sortedExams(p)[0];
    if (!last || !last.date) return null;
    var due = addMonths(last.date, REMIND_MONTHS);
    if (!due) return null;
    var status;
    if (p.noRemind) status = 'off';
    else if (p.reminded && p.reminded.examId === last.id) status = 'sent';
    else if (due <= today()) status = 'due';
    else if (due <= addDays(today(), 30)) status = 'soon';
    else status = 'later';
    return { p: p, last: last, due: due, status: status };
  }
  function allDue(status) {
    var out = [];
    patients.forEach(function (p) { var i = dueInfo(p); if (i && i.status === status) out.push(i); });
    out.sort(function (a, b) { return a.due.localeCompare(b.due); });
    return out;
  }
  function sendReminder(i) {
    var wa = waLink(i.p.phone);
    if (!wa) { alert('لا يوجد رقم هاتف صالح لهذا المريض.'); return; }
    var a = document.createElement('a');
    a.href = wa + '?text=' + encodeURIComponent(remindMessage(i.p));
    a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    i.p.reminded = { examId: i.last.id, date: today() };
    save();
    refresh(true);
  }
  function dismissReminder(i) {
    i.p.reminded = { examId: i.last.id, date: today(), dismissed: true };
    save();
    refresh(true);
  }

  /* ---------- rendering: list ---------- */
  function renderList() {
    var q = norm(query);
    var qd = digits(query);
    var items = patients.filter(function (p) {
      if (!q) return true;
      if (norm(p.name).indexOf(q) > -1) return true;
      return qd.length >= 3 && digits(p.phone).indexOf(qd) > -1;
    }).sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });

    listEl.textContent = '';
    countEl.textContent = patients.length ? (q ? items.length + ' نتيجة من ' + patients.length : patients.length + ' مريض') : '';

    if (!patients.length) {
      listEl.appendChild(h('li', { class: 'empty', text: 'لا يوجد مرضى بعد. اضغط «+ مريض جديد» لإضافة أول مريض.' }));
      return;
    }
    if (!items.length) {
      listEl.appendChild(h('li', { class: 'empty', text: 'لا توجد نتائج مطابقة.' }));
      return;
    }
    items.forEach(function (p) {
      var ex = sortedExams(p);
      var meta = ex.length ? 'آخر فحص: ' + fmtDate(ex[0].date) + ' · ' + ex.length + ' فحص' : 'لا توجد فحوصات';
      var btn = h('button', { type: 'button', class: 'pitem', 'aria-current': p.id === selectedId ? 'true' : 'false',
        onclick: function () { select(p.id); } },
        h('b', { text: p.name }),
        p.phone ? h('span', { class: 'ltr', style: 'text-align:right', text: p.phone }) : null,
        h('span', { text: meta }),
        (ex.length && ex[0].done && !ex[0].notified) ? h('span', { class: 'flag', text: 'نظارة جاهزة · لم يُبلَّغ المريض' }) : null);
      listEl.appendChild(h('li', {}, btn));
    });
  }

  function updateNote() {
    var last = lastBackup();
    var need = patients.length > 0 && (!last || Date.now() - last > 7 * 86400000);
    noteEl.hidden = !need;
    noteEl.textContent = last
      ? 'مرّ أكثر من أسبوع على آخر نسخة احتياطية. اضغط هنا لحفظ نسخة جديدة.'
      : 'لم تحفظ نسخة احتياطية بعد. اضغط هنا لحفظ نسخة.';
    btnLockEl.hidden = !getPin();
    var n = allDue('due').length;
    badgeEl.hidden = !n;
    badgeEl.textContent = n;
    noteDueEl.hidden = !n;

  /* ---------- exam image ---------- */
  function wrapLines(c, text, maxW) {
    var words = String(text).replace(/\s+/g, ' ').trim().split(' '), lines = [], cur = '';
    words.forEach(function (w) {
      var t = cur ? cur + ' ' + w : w;
      if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function drawExamImage(p, e, cv) {
    var W = 1080, H = 1350;
    cv.width = W; cv.height = H;
    var c = cv.getContext('2d');
    var INK = '#15171A', MUTED = '#565C63', LINE = '#C9CED3', ACC = '#A4501A', ALT = '#EEF1F3';
    var DISP = '"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif';
    var BODY = '"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif';
    var R = W - 70;

    function txt(s, x, y, font, color, align, dir) {
      c.font = font; c.fillStyle = color; c.textAlign = align || 'right';
      c.direction = dir || 'rtl'; c.textBaseline = 'alphabetic';
      c.fillText(s, x, y);
    }

    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, W, H);
    c.fillStyle = ACC; c.fillRect(0, 0, W, 16);

    // glasses icon
    c.strokeStyle = ACC; c.lineWidth = 8; c.lineCap = 'round';
    c.beginPath(); c.arc(112, 100, 34, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(194, 100, 34, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(144, 92); c.quadraticCurveTo(153, 84, 162, 92); c.stroke();

    txt(SHOP.name, R, 104, '800 58px ' + DISP, INK);
    txt(SHOP.tagline, R, 154, '400 28px ' + BODY, MUTED);
    c.strokeStyle = LINE; c.lineWidth = 2;
    c.beginPath(); c.moveTo(70, 196); c.lineTo(W - 70, 196); c.stroke();

    txt('بطاقة فحص النظر', R, 276, '800 44px ' + DISP, INK);
    txt('الاسم: ' + p.name, R, 350, '600 36px ' + BODY, INK);
    txt('تاريخ الفحص: ' + fmtDate(e.date), 70, 350, '400 30px ' + BODY, MUTED, 'left');
    var ty = 400;
    if (p.age) { txt('العمر: ' + p.age, R, 400, '400 30px ' + BODY, MUTED); ty = 445; }

    // table (left-to-right like a standard Rx chart)
    var tx = 70, labelW = 200, colW = 148, headH = 64, rowH = 96;
    var tw = labelW + colW * 5;
    c.fillStyle = ALT; c.fillRect(tx, ty, tw, headH);
    for (var i = 0; i < 5; i++) txt(HEADS[i], tx + labelW + colW * i + colW / 2, ty + 43, '600 28px ' + BODY, INK, 'center', 'ltr');
    [['od', 'يمنى', 'OD'], ['os', 'يسرى', 'OS']].forEach(function (eye, r) {
      var y = ty + headH + rowH * r;
      txt(eye[1], tx + labelW / 2, y + 44, '600 32px ' + BODY, INK, 'center');
      txt(eye[2], tx + labelW / 2, y + 78, '400 22px ' + BODY, MUTED, 'center', 'ltr');
      COLS.forEach(function (col, k) {
        var v = (e[eye[0]] || {})[col];
        txt(v ? v : '—', tx + labelW + colW * k + colW / 2, y + 62, '500 38px ' + BODY, v ? INK : MUTED, 'center', 'ltr');
      });
    });
    var th = headH + rowH * 2;
    c.strokeStyle = LINE; c.lineWidth = 2;
    c.strokeRect(tx, ty, tw, th);
    c.beginPath();
    c.moveTo(tx, ty + headH); c.lineTo(tx + tw, ty + headH);
    c.moveTo(tx, ty + headH + rowH); c.lineTo(tx + tw, ty + headH + rowH);
    c.moveTo(tx + labelW, ty); c.lineTo(tx + labelW, ty + th);
    for (var j = 1; j < 5; j++) { c.moveTo(tx + labelW + colW * j, ty); c.lineTo(tx + labelW + colW * j, ty + th); }
    c.stroke();

    var y = ty + th + 70;
    if (e.pd) { txt('المسافة بين البؤبؤين PD: ' + e.pd, R, y, '600 32px ' + BODY, INK); y += 56; }
    var nx = addMonths(e.date, REMIND_MONTHS);
    if (nx) { txt('موعد إعادة الفحص المقترح: ' + fmtDate(nx), R, y, '600 32px ' + BODY, ACC); y += 60; }
    if (e.notes) {
      c.font = '400 30px ' + BODY; c.direction = 'rtl';
      var lines = wrapLines(c, 'ملاحظات: ' + e.notes, tw).slice(0, 4);
      lines.forEach(function (ln) { txt(ln, R, y, '400 30px ' + BODY, INK); y += 46; });
    }

    // legend
    c.font = '400 24px ' + BODY; c.direction = 'rtl';
    var legend = wrapLines(c, 'SPH: القوة الكروية · CYL: القوة الأسطوانية · AXIS: المحور · ADD: الإضافة للقراءة · VA: حدة البصر', tw);
    var ly = H - 190 - 30 - (legend.length - 1) * 36;
    legend.forEach(function (ln) { txt(ln, R, ly, '400 24px ' + BODY, MUTED); ly += 36; });

    // footer
    c.fillStyle = ALT; c.fillRect(0, H - 190, W, 190);
    txt(SHOP.name, W / 2, H - 135, '800 34px ' + DISP, INK, 'center');
    c.font = '400 25px ' + BODY; c.direction = 'rtl';
    var fl = wrapLines(c, SHOP.address, tw).slice(0, 2), fy = H - 92;
    fl.forEach(function (ln) { txt(ln, W / 2, fy, '400 25px ' + BODY, MUTED, 'center'); fy += 34; });
    txt('الهاتف: ' + SHOP.phone + '   ·   الدوام ' + SHOP.hours, W / 2, fy + 2, '400 23px ' + BODY, MUTED, 'center');
  }

  function downloadBlob(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function shareCanvas(cv, name) {
    cv.toBlob(function (blob) {
      if (!blob) { alert('تعذّر إنشاء الصورة.'); return; }
      var file = null;
      try { file = new File([blob], name, { type: 'image/png' }); } catch (err) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'فحص النظر' }).catch(function () {});
      } else {
        downloadBlob(blob, name);
        alert('تم حفظ الصورة في جهازك. أرفقها في محادثة المريض على واتساب.');
      }
    }, 'image/png');
  }
  function saveCanvas(cv, name) {
    cv.toBlob(function (blob) { if (blob) downloadBlob(blob, name); }, 'image/png');
  }

  function imageView(p, e) {
    var cv = h('canvas', { class: 'examimg' });
    var fname = 'eye-exam-' + (e.date || today()) + '.png';
    var acts = h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn btn-primary', text: 'مشاركة الصورة', onclick: function () { shareCanvas(cv, fname); } }),
      h('button', { type: 'button', class: 'btn', text: 'حفظ في الجهاز', onclick: function () { saveCanvas(cv, fname); } }));
    if (waLink(p.phone)) {
      acts.appendChild(h('button', { type: 'button', class: 'btn', text: 'فتح محادثة المريض', onclick: function () { openWhatsApp(p.phone, ''); } }));
    }
    acts.appendChild(h('button', { type: 'button', class: 'btn', text: 'رجوع', onclick: function () { editingExamId = null; mode = 'view'; refresh(); } }));

    var wrap = h('div', {},
      h('div', { class: 'card' },
        h('h2', { text: 'صورة الفحص — ' + p.name }),
        h('p', { class: 'hint', text: 'اضغط «مشاركة الصورة» واختر واتساب ثم المريض. وإن لم تظهر نافذة المشاركة تُحفظ الصورة في جهازك، فأرفقها من محادثة المريض.' }),
        h('div', { style: 'height:.5rem' }),
        acts),
      cv);
    var draw = function () { drawExamImage(p, e, cv); };
    draw();
    if (document.fonts && document.fonts.load && window.Promise) {
      var sample = 'الدقة للبصريات فحص النظر 0123';
      Promise.all([
        document.fonts.load('800 40px "Noto Kufi Arabic"', sample),
        document.fonts.load('400 30px "IBM Plex Sans Arabic"', sample),
        document.fonts.load('600 30px "IBM Plex Sans Arabic"', sample)
      ]).then(draw, draw);
    }
    return wrap;
  }

  /* ---------- PIN lock ---------- */
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  function getPin() {
    try { var r = localStorage.getItem(PIN_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  }
  function cyrb53(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  function hashPin(pin, salt, weak) {
    var data = salt + ':' + pin;
    if (!weak && window.crypto && crypto.subtle && window.TextEncoder && window.Promise) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)).then(function (buf) {
        return 's:' + Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    }
    return Promise.resolve('w:' + cyrb53(data));
  }
  function checkPin(pin) {
    var cfg = getPin();
    if (!cfg) return Promise.resolve(true);
    return hashPin(pin, cfg.salt, cfg.hash.charAt(0) === 'w').then(function (hx) { return hx === cfg.hash; });
  }
  function setPin(pin) {
    var salt = uid();
    return hashPin(pin, salt, false).then(function (hx) {
      try { localStorage.setItem(PIN_KEY, JSON.stringify({ salt: salt, hash: hx })); return true; } catch (e) { return false; }
    });
  }
  function removePin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }
  function getFail() {
    try { return JSON.parse(localStorage.getItem(FAIL_KEY) || '{"n":0,"until":0}'); } catch (e) { return { n: 0, until: 0 }; }
  }
  function setFail(f) { try { localStorage.setItem(FAIL_KEY, JSON.stringify(f)); } catch (e) {} }
  function waitLeft() { return Math.max(0, Math.ceil((getFail().until - Date.now()) / 1000)); }
  function tryPin(pin) {
    var w = waitLeft();
    if (w > 0) return Promise.resolve({ ok: false, wait: w });
    return checkPin(pin).then(function (ok) {
      if (ok) setFail({ n: 0, until: 0 });
      else {
        var f = getFail(); f.n = (f.n || 0) + 1;
        if (f.n >= 5) { f.until = Date.now() + 30000; f.n = 0; }
        setFail(f);
      }
      return { ok: ok, wait: waitLeft() };
    });
  }
  function showLock() {
    document.body.classList.add('locked');
    lockEl.hidden = false;
    lockPinEl.value = ''; lockErrEl.textContent = '';
    setTimeout(function () { lockPinEl.focus(); }, 50);
  }
  function lockNow() {
    ssDel(UNL);
    listEl.textContent = ''; detailEl.textContent = ''; countEl.textContent = '';
    noteEl.hidden = true; noteDueEl.hidden = true; badgeEl.hidden = true;
    selectedId = null; editingExamId = null; mode = 'none'; query = ''; searchEl.value = '';
    showLock();
  }
  function watchIdle() {
    ['click', 'keydown', 'touchstart', 'input', 'scroll'].forEach(function (t) {
      document.addEventListener(t, function () { lastActive = Date.now(); }, true);
    });
    function check() {
      if (getPin() && ssGet(UNL) === '1' && Date.now() - lastActive > IDLE_MS) lockNow();
    }
    setInterval(check, 15000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  }
  function start() {
    document.body.classList.remove('locked');
    lockEl.hidden = true;
    refresh();
    if (!started) { started = true; watchIdle(); }
  }

  function pinCard() {
    var cfg = getPin();
    function pinInput() { return h('input', { class: 'inp ltr', type: 'password', inputmode: 'numeric', autocomplete: 'off' }); }
    var cur = pinInput(), n1 = pinInput(), n2 = pinInput();
    var msg = h('p', { class: 'error', role: 'alert', hidden: true });
    function say(t) { msg.textContent = t; msg.hidden = false; }
    function newPin() {
      var a = digits(n1.value), b = digits(n2.value);
      if (a.length < 4 || a.length > 8) { say('الرمز يجب أن يكون من 4 إلى 8 أرقام.'); return null; }
      if (a !== b) { say('الرمزان غير متطابقين.'); return null; }
      return a;
    }
    function verifyCurrent(then) {
      tryPin(digits(cur.value)).then(function (r) {
        if (!r.ok) { say(r.wait > 0 ? 'محاولات كثيرة خاطئة. انتظر ' + r.wait + ' ثانية.' : 'الرمز الحالي غير صحيح.'); return; }
        then();
      });
    }
    var acts = h('div', { class: 'form-actions' },
      h('button', { type: 'submit', class: 'btn btn-primary', text: cfg ? 'تغيير الرمز' : 'تفعيل القفل' }));
    if (cfg) {
      acts.appendChild(h('button', { type: 'button', class: 'btn', text: 'قفل الآن', onclick: lockNow }));
      acts.appendChild(h('button', { type: 'button', class: 'btn btn-danger', text: 'إيقاف القفل', onclick: function () {
        if (!cur.value) { say('اكتب الرمز الحالي أولاً.'); return; }
        verifyCurrent(function () {
          if (confirm('إيقاف القفل؟ سيفتح التطبيق بدون رمز على هذا الجهاز.')) { removePin(); ssDel(UNL); refresh(); }
        });
      } }));
    }
    var form = h('form', { class: 'card', novalidate: true },
      h('h3', { text: 'القفل بالرمز السري' }),
      h('p', { class: 'hint', text: cfg
        ? 'القفل مفعّل على هذا الجهاز. يُطلب الرمز عند فتح التطبيق، ويُقفل تلقائياً بعد ' + Math.round(IDLE_MS / 60000) + ' دقائق من عدم الاستخدام.'
        : 'غير مفعّل. فعّله حتى لا يستطيع من يمسك الجهاز فتح سجلات المرضى. الرمز خاص بهذا الجهاز فقط، وإذا نسيته لا يمكن استرجاعه، وقد تضطر لمسح بيانات المتصفح فتضيع السجلات إن لم تكن لديك نسخة احتياطية.' }),
      h('div', { style: 'height:.5rem' }),
      msg,
      cfg ? field('الرمز الحالي', cur) : null,
      field(cfg ? 'الرمز الجديد (4 إلى 8 أرقام)' : 'رمز جديد (4 إلى 8 أرقام)', n1),
      field('تأكيد الرمز', n2),
      acts);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var np = newPin();
      if (!np) return;
      function go() {
        setPin(np).then(function (ok) {
          if (!ok) { say('تعذّر حفظ الرمز.'); return; }
          ssSet(UNL, '1'); lastActive = Date.now();
          alert('تم حفظ الرمز السري.');
          refresh();
        });
      }
      if (cfg) verifyCurrent(go); else go();
    });
    return form;
  }

  function backupView() {
    var exams = 0;
    patients.forEach(function (p) { exams += p.exams.length; });
    var last = lastBackup();
    var fileI = h('input', { type: 'file', accept: '.json,application/json', class: 'inp' });
    fileI.addEventListener('change', function () {
      var f = fileI.files && fileI.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          var arr = Array.isArray(d) ? d : d.patients;
          if (!Array.isArray(arr) || arr.some(function (x) { return !x || !x.id || !x.name; })) throw new Error('bad');
          if (confirm('سيتم استبدال السجلات الحالية (' + patients.length + ' مريض) بسجلات النسخة (' + arr.length + ' مريض). هل تريد المتابعة؟')) {
            var old = patients;
            patients = arr.map(fixPatient);
            if (!save()) { patients = old; return; }
            selectedId = null; mode = 'none'; refresh();
            alert('تم استرجاع السجلات.');
          }
        } catch (err) { alert('هذا الملف ليس نسخة احتياطية صالحة.'); }
        fileI.value = '';
      };
      r.readAsText(f);
    });

    return h('div', {},
      h('button', { type: 'button', class: 'btn back', text: '→ رجوع للقائمة', onclick: back }),
      h('div', { class: 'card' },
        h('h2', { text: 'النسخة الاحتياطية' }),
        h('p', { class: 'meta', text: patients.length + ' مريض · ' + exams + ' فحص' }),
        h('p', { class: 'meta', text: last ? 'آخر نسخة: ' + new Date(last).toLocaleDateString('en-GB') : 'لم تُحفظ نسخة بعد' }),
        h('p', { class: 'notes', text: 'السجلات محفوظة داخل متصفح هذا الجهاز فقط. إذا مُسحت بيانات المتصفح أو تعطّل الجهاز ضاعت السجلات، لذلك احفظ نسخة كل أسبوع وأرسلها لنفسك على واتساب أو انسخها إلى مكان آخر.' }),
        h('div', { class: 'form-actions', style: 'margin-top:1rem' },
          h('button', { type: 'button', class: 'btn btn-primary', text: 'تنزيل نسخة احتياطية', onclick: downloadBackup }))),
      h('div', { class: 'card' },
        h('h3', { text: 'استرجاع من نسخة' }),
        h('p', { class: 'hint', text: 'اختر ملف النسخة الاحتياطية (.json). سيحل محل السجلات الحالية.' }),
        h('div', { style: 'height:.6rem' }),
        fileI),
      pinCard());
  }

  function downloadBackup() {
    var data = { app: 'aldiqqa-patients', version: 1, exported: new Date().toISOString(), patients: patients };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'aldiqqa-backup-' + today() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    try { localStorage.setItem(BK, String(Date.now())); } catch (e) {}
    updateNote();
  }

  function renderDetail() {
    detailEl.textContent = '';
    var p = getPatient(selectedId);
    if (mode === 'backup') detailEl.appendChild(backupView());
    else if (mode === 'reminders') detailEl.appendChild(remindersView());
    else if (mode === 'newPatient') detailEl.appendChild(patientForm(null));
    else if (!p) detailEl.appendChild(h('div', { class: 'card' }, h('h3', { text: 'اختر مريضاً من القائمة' }), h('p', { class: 'hint', text: 'أو اضغط «+ مريض جديد» لإضافة ملف جديد وتسجيل فحصه.' })));
    else if (mode === 'editPatient') detailEl.appendChild(patientForm(p));
    else if (mode === 'image') {
      var ie = null;
      for (var q = 0; q < p.exams.length; q++) if (p.exams[q].id === editingExamId) ie = p.exams[q];
      if (ie) detailEl.appendChild(imageView(p, ie)); else detailEl.appendChild(viewPatient(p));
    } else if (mode === 'exam') {
      var ex = null;
      if (editingExamId) for (var i = 0; i < p.exams.length; i++) if (p.exams[i].id === editingExamId) ex = p.exams[i];
      detailEl.appendChild(examForm(p, ex));
    } else detailEl.appendChild(viewPatient(p));
  }

  function refresh(keepScroll) {
    var y = window.pageYOffset;
    document.body.classList.toggle('detail-open', mode !== 'none');
    renderList();
    renderDetail();
    updateNote();
    window.scrollTo(0, keepScroll === true ? y : 0);
  }
  function select(id) { selectedId = id; editingExamId = null; mode = 'view'; refresh(); }
  function back() { selectedId = null; editingExamId = null; mode = 'none'; refresh(); }

  /* ---------- events ---------- */
  searchEl.addEventListener('input', function () { query = searchEl.value; renderList(); });
  document.getElementById('btnNew').addEventListener('click', function () { selectedId = null; mode = 'newPatient'; refresh(); });
  document.getElementById('btnBackup').addEventListener('click', function () { mode = 'backup'; refresh(); });
  noteEl.addEventListener('click', function () { mode = 'backup'; refresh(); });
  document.getElementById('btnRemind').addEventListener('click', function () { selectedId = null; mode = 'reminders'; refresh(); });
  noteDueEl.addEventListener('click', function () { selectedId = null; mode = 'reminders'; refresh(); });

  btnLockEl.addEventListener('click', lockNow);
  lockForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    tryPin(digits(lockPinEl.value)).then(function (r) {
      if (r.ok) { ssSet(UNL, '1'); lastActive = Date.now(); start(); }
      else {
        lockPinEl.value = '';
        lockErrEl.textContent = r.wait > 0 ? 'محاولات كثيرة خاطئة. انتظر ' + r.wait + ' ثانية.' : 'الرمز غير صحيح.';
      }
    });
  });

  load();
  if (getPin() && ssGet(UNL) !== '1') showLock(); else start();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
</body>
